[project]
name = "llmanki"
version = "0.1.0"
description = "Telegram bot that generates Anki cards using LLMs and syncs via AnkiConnect."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex" }]

dependencies = [
  "python-telegram-bot>=21.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pre-commit>=3.7.0",
  "ruff>=0.6.0",
  "ty",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
